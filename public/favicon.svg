<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Atom Orbit Gradients -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Filter for subtle drop shadow and glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Icon Container with rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brandGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="30" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Outer ambient ring -->
  <circle cx="64" cy="64" r="50" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Physics Orbit 1 (Tilted -45deg) -->
  <ellipse cx="64" cy="64" rx="46" ry="17" stroke="url(#orbitGrad1)" stroke-width="4.5" transform="rotate(-40 64 64)" stroke-linecap="round" opacity="0.9" />

  <!-- Chemistry / Physics Orbit 2 (Tilted +40deg) -->
  <ellipse cx="64" cy="64" rx="46" ry="17" stroke="url(#orbitGrad2)" stroke-width="4.5" transform="rotate(40 64 64)" stroke-linecap="round" opacity="0.9" />

  <!-- Central Scientific Core: Biology / DNA & Molecule Synthesis -->
  <!-- Subtle glowing core circle -->
  <circle cx="64" cy="64" r="22" fill="#ffffff" fill-opacity="0.12" />

  <!-- Stylized leaf & DNA double spark -->
  <!-- Left curve (Botany / Bio Leaf facet) -->
  <path d="M64 36 C78 44, 82 56, 76 72 C70 82, 64 88, 64 88 C64 88, 58 82, 52 72 C46 56, 50 44, 64 36 Z" 
        fill="url(#coreGrad)" 
        filter="url(#glow)" />

  <!-- Botany inner stem & Zoology neural axis -->
  <path d="M64 42 C64 54, 64 66, 64 82" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M64 52 Q71 50, 73 45" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <path d="M64 62 Q57 60, 55 55" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <path d="M64 71 Q71 69, 73 64" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />

  <!-- Orbiting particles (Physics electrons & Chemistry atoms) -->
  <!-- Particle 1: Top-Right (Electric cyan) -->
  <circle cx="95" cy="38" r="5" fill="#38bdf8" />
  <circle cx="95" cy="38" r="8" fill="#38bdf8" fill-opacity="0.3" />

  <!-- Particle 2: Bottom-Left (Emerald) -->
  <circle cx="33" cy="90" r="5" fill="#34d399" />
  <circle cx="33" cy="90" r="8" fill="#34d399" fill-opacity="0.3" />

  <!-- Particle 3: Top-Left (Golden energy) -->
  <circle cx="35" cy="38" r="4.5" fill="#fbbf24" />
  <circle cx="35" cy="38" r="7.5" fill="#fbbf24" fill-opacity="0.3" />

  <!-- Particle 4: Bottom-Right (Indigo/Violet) -->
  <circle cx="93" cy="90" r="4.5" fill="#a78bfa" />
  <circle cx="93" cy="90" r="7.5" fill="#a78bfa" fill-opacity="0.3" />

  <!-- Central luminous core pip -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" />
</svg>
